<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0F766E">
  <title>Qoomia · Offline</title>
  <link rel="icon" href="/icons/qoomia-v4-1-192.png">
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:#f8fafc;color:#102a2a}
    main{width:min(100%,420px);padding:28px;border:1px solid #d8e4e2;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(6,78,59,.12);text-align:center}
    img{width:72px;height:72px;border-radius:18px}
    h1{margin:18px 0 8px;font-size:1.35rem}
    p{margin:0 0 20px;color:#526564;line-height:1.55}
    button{min-height:46px;padding:0 20px;border:0;border-radius:999px;background:#0f766e;color:#fff;font:inherit;font-weight:800;cursor:pointer}
    @media(prefers-color-scheme:dark){body{background:#090d16;color:#f8fafc}main{border-color:#253039;background:#111827}p{color:#aebbbb}}
  </style>
</head>
<body>
  <main>
    <img src="/icons/qoomia-v4-1-192.png" alt="Qoomia">
    <h1>Sei offline</h1>
    <p>I dati finanziari non vengono salvati nella cache del dispositivo. Riconnettiti per aggiornare e usare Qoomia in sicurezza.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
